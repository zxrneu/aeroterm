name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Publish macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'apps/web-ui/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: apps/web-ui
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/web-ui
        run: pnpm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and package DMG
        run: ./scripts/package_macos.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/AeroTerm_v0.1.0_macOS.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
